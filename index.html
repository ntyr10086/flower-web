<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Language - 療癒花語手帳</title>
    <style>
        :root {
            --primary-warm: #E6A15C;
            --primary-brown: #966F46;
            --bg-cream: #FDFBF7;
            --light-bg: #F5EBE6;
            --text-dark: #4A3728;
            --text-light: #7A6B60;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, var(--bg-cream) 0%, #F9F3EB 100%); font-family: 'Lora', serif; color: var(--text-dark); }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        /* LOGIN */
        .login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 500px; box-shadow: 0 20px 60px rgba(102, 85, 68, 0.15); }
        .login-box h1 { text-align: center; color: var(--primary-warm); margin-bottom: 30px; font-size: 2.5rem; }
        .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px; }
        .tab-btn { padding: 12px; border: 2px solid var(--light-bg); background: var(--light-bg); border-radius: 10px; cursor: pointer; font-weight: 600; color: var(--text-light); }
        .tab-btn.active { background: var(--primary-warm); color: white; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid var(--light-bg); border-radius: 10px; font-size: 14px; font-family: inherit; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-warm); }
        .submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary-warm) 0%, #D89548 100%); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
        .submit-btn:hover { transform: translateY(-2px); }
        .form-content { display: none; }
        .form-content.active { display: block; }
        .demo-credentials { background: var(--light-bg); padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 13px; color: #4CAF50; font-weight: 600; }

        /* APP */
        .main-content { display: none; padding-bottom: 150px; }
        .main-content.active { display: block; }
        .header { background: linear-gradient(135deg, var(--primary-warm) 0%, #D89548 100%); color: white; padding: 2rem; border-radius: 15px; margin-bottom: 2rem; text-align: center; }
        .header h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
        .nav-tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 2rem; }
        .nav-tab { padding: 12px; background: white; border: 2px solid var(--light-bg); border-radius: 10px; cursor: pointer; font-weight: 600; color: var(--text-light); transition: all 0.3s; }
        .nav-tab.active { background: var(--primary-warm); color: white; }
        .section { display: none; }
        .section.active { display: block; }
        .card { background: white; border-radius: 15px; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 4px 15px rgba(102, 85, 68, 0.08); }
        .card h2 { color: var(--primary-warm); margin-bottom: 1.5rem; font-size: 1.5rem; }
        .card h3 { color: var(--primary-brown); margin: 1.5rem 0 1rem; font-size: 1.1rem; }

        /* DIARY */
        .diary-container { display: grid; grid-template-columns: 1fr 350px; gap: 2rem; }
        .diary-editor { background: #FDFBF7; border-radius: 15px; padding: 2rem; min-height: 400px; border: 3px solid var(--primary-warm); }
        .diary-textarea { width: 100%; height: 350px; border: none; background: transparent; font-family: 'Lora', serif; resize: none; outline: none; }

        /* CUSTOMIZE */
        .customize-panel { background: white; border-radius: 15px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(102, 85, 68, 0.08); }
        .customize-btn { width: 100%; padding: 12px; background: var(--primary-warm); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; margin-bottom: 1rem; }
        .panel-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 1rem; }
        .panel-tab { padding: 8px; background: var(--light-bg); border: none; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--text-light); }
        .panel-tab.active { background: var(--primary-warm); color: white; }
        .panel-content { display: none; }
        .panel-content.active { display: block; }
        .item-grid { display: grid; gap: 0.8rem; max-height: 300px; overflow-y: auto; }
        .item-slot { padding: 10px; background: var(--light-bg); border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
        .item-slot.locked { opacity: 0.6; cursor: not-allowed; }
        .item-slot.active { background: var(--primary-warm); color: white; }

        /* ADMIN PAGES */
        .form-section { background: var(--light-bg); padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .item-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .item-card { background: white; border-radius: 12px; padding: 1.5rem; border: 2px solid var(--light-bg); }
        .item-card h4 { color: var(--primary-warm); margin-bottom: 0.5rem; }
        .item-card p { font-size: 0.9rem; color: var(--text-light); margin-bottom: 0.5rem; }
        .action-buttons { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .btn-edit, .btn-delete { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .btn-edit { background: #FFD700; color: #333; }
        .btn-delete { background: #FF6B6B; color: white; }
        .btn-edit:hover { background: #FFC700; }
        .btn-delete:hover { background: #FF5252; }

        /* SHOP */
        .flower-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; margin: 2rem 0; }
        .flower-card { background: white; border-radius: 15px; padding: 1.5rem; text-align: center; box-shadow: 0 4px 15px rgba(102, 85, 68, 0.08); }
        .flower-icon { font-size: 2.5rem; margin-bottom: 1rem; }
        .flower-card h3 { color: var(--primary-warm); margin-bottom: 0.5rem; }
        .buy-btn { background: var(--primary-warm); color: white; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 1rem; }
        .buy-btn:disabled { background: #4CAF50; }

        /* STATS */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin: 2rem 0; }
        .stat-box { background: linear-gradient(135deg, var(--primary-warm) 0%, #D89548 100%); color: white; padding: 1.5rem; border-radius: 15px; text-align: center; }
        .stat-box .number { font-size: 2rem; font-weight: bold; }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 2px solid var(--light-bg); padding: 0.8rem; display: flex; justify-content: center; gap: 0.5rem; z-index: 1000; }
        .nav-btn { padding: 8px 12px; background: var(--light-bg); border: none; border-radius: 15px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .nav-btn.active { background: var(--primary-warm); color: white; }
        .nav-btn.logout { background: #FFB6B6; color: white; }

        @media (max-width: 1024px) {
            .diary-container { grid-template-columns: 1fr; }
            .customize-panel { display: none; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="loginPage" class="login-page">
        <div class="login-box">
            <h1>🌸 Flower Language</h1>
            <p style="text-align: center; margin-bottom: 2rem; color: var(--text-light);">療癒花語手帳</p>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchLoginTab('login', this)">登入</button>
                <button class="tab-btn" onclick="switchLoginTab('register', this)">註冊</button>
                <button class="tab-btn" onclick="switchLoginTab('admin', this)">👑 管理員</button>
            </div>

            <div id="login" class="form-content active">
                <div class="demo-credentials">✓ 測試帳號：testuser / password123</div>
                <form onsubmit="loginUser(event)">
                    <div class="form-group"><label>帳號</label><input type="text" id="user-username" required></div>
                    <div class="form-group"><label>密碼</label><input type="password" id="user-password" required></div>
                    <button type="submit" class="submit-btn">進入</button>
                </form>
            </div>

            <div id="register" class="form-content">
                <form onsubmit="registerUser(event)">
                    <div class="form-group"><label>新帳號</label><input type="text" id="reg-username" minlength="3" required></div>
                    <div class="form-group"><label>密碼</label><input type="password" id="reg-password" minlength="6" required></div>
                    <div class="form-group"><label>確認密碼</label><input type="password" id="reg-confirm-password" required></div>
                    <button type="submit" class="submit-btn">建立帳號</button>
                </form>
            </div>

            <div id="admin" class="form-content">
                <div class="demo-credentials">✓ 管理員：admin001 / adminPass123</div>
                <form onsubmit="loginAdmin(event)">
                    <div class="form-group"><label>帳號</label><input type="text" id="admin-username" required></div>
                    <div class="form-group"><label>密碼</label><input type="password" id="admin-password" required></div>
                    <button type="submit" class="submit-btn">進入管理台</button>
                </form>
            </div>
        </div>
    </div>

    <!-- APP -->
    <div id="mainApp" class="main-content">
        <div class="container">
            <div class="header" id="appHeader"><h1>💭 Flower Language</h1></div>

            <div class="nav-tabs" id="navTabs">
                <button class="nav-tab active" onclick="switchSection('dashboard', this)">📊 儀表板</button>
                <button class="nav-tab user-only" onclick="switchSection('diary', this)">✍️ 日記</button>
                <button class="nav-tab user-only" onclick="switchSection('emotions', this)">💭 心情</button>
                <button class="nav-tab" onclick="switchSection('shop', this)">🛍️ 商店</button>
                <button class="nav-tab admin-only" style="display:none;" onclick="switchSection('flowers', this)">🌸 花卉</button>
                <button class="nav-tab admin-only" style="display:none;" onclick="switchSection('products', this)">📦 商品</button>
                <button class="nav-tab admin-only" style="display:none;" onclick="switchSection('moderation', this)">🔍 審查</button>
            </div>

            <!-- DASHBOARD -->
            <div id="dashboard" class="section active">
                <div class="card">
                    <h2>📊 統計</h2>
                    <div class="stats-grid">
                        <div class="stat-box"><div class="number" id="stat1">500</div><div id="stat1-label">積分</div></div>
                        <div class="stat-box"><div class="number" id="stat2">1</div><div>已擁有物品</div></div>
                    </div>
                </div>
            </div>

            <!-- DIARY -->
            <div id="diary" class="section">
                <div class="card">
                    <h2>✍️ 寫日記</h2>
                    <div class="diary-container">
                        <div class="diary-editor" id="diaryEditor"><textarea class="diary-textarea" id="diaryText" placeholder="寫下今天的心情..."></textarea></div>
                        <div class="customize-panel">
                            <button class="customize-btn">🎨 客製化</button>
                            <div class="panel-tabs">
                                <button class="panel-tab active" onclick="switchPanelTab('background', this)">🎨 背景</button>
                                <button class="panel-tab" onclick="switchPanelTab('sticker', this)">✨ 貼紙</button>
                            </div>
                            <div id="background" class="panel-content active"><h3>選擇背景</h3><div class="item-grid" id="backgroundList"></div></div>
                            <div id="sticker" class="panel-content"><h3>選擇貼紙</h3><div class="item-grid" id="stickerList"></div></div>
                            <button class="submit-btn" style="margin-top: 1rem; width: 100%;" onclick="saveDiary()">💾 保存</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- EMOTIONS -->
            <div id="emotions" class="section">
                <div class="card">
                    <h2>💭 記錄心情</h2>
                    <div style="margin-bottom: 2rem;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 600;">
                            <span>愉悅度</span><span id="valenceValue">0.0</span>
                        </div>
                        <input type="range" id="valenceSlider" min="-1" max="1" step="0.1" value="0" oninput="updateEmotion()" style="width: 100%;">
                    </div>
                    <div style="margin-bottom: 2rem;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 600;">
                            <span>能量水平</span><span id="arousalValue">0.0</span>
                        </div>
                        <input type="range" id="arousalSlider" min="-1" max="1" step="0.1" value="0" oninput="updateEmotion()" style="width: 100%;">
                    </div>
                    <h3>⭐ 推薦花卉</h3>
                    <div class="flower-grid" id="recommendedFlowers"><p style="grid-column: 1 / -1; text-align: center;">調整滑桿以獲得推薦</p></div>
                    <button class="submit-btn" style="margin-top: 2rem;" onclick="recordEmotion()">✅ 記錄</button>
                </div>
            </div>

            <!-- SHOP -->
            <div id="shop" class="section">
                <div class="card">
                    <h2>🛍️ 虛擬商店</h2>
                    <div class="flower-grid" id="shopItems"></div>
                </div>
            </div>

            <!-- ADMIN: FLOWERS -->
            <div id="flowers" class="section">
                <div class="card">
                    <h2>🌸 管理花卉</h2>
                    
                    <h3>➕ 新增花卉</h3>
                    <div class="form-section">
                        <div class="form-grid">
                            <div class="form-group"><label>花卉名稱（中文）</label><input type="text" id="flower-cn-name" placeholder="e.g. 向日葵"></div>
                            <div class="form-group"><label>英文名稱</label><input type="text" id="flower-en-name" placeholder="e.g. Sunflower"></div>
                            <div class="form-group"><label>Emoji</label><input type="text" id="flower-emoji" placeholder="🌻" maxlength="2"></div>
                            <div class="form-group"><label>花語含意</label><input type="text" id="flower-language" placeholder="熱情、忠誠"></div>
                            <div class="form-group"><label>愉悅度 (Valence) [-1~1]</label><input type="number" id="flower-valence" min="-1" max="1" step="0.1" value="0"></div>
                            <div class="form-group"><label>能量水平 (Arousal) [-1~1]</label><input type="number" id="flower-arousal" min="-1" max="1" step="0.1" value="0"></div>
                        </div>
                        <button class="submit-btn" onclick="addFlower()">✅ 新增花卉</button>
                    </div>

                    <h3>📋 現有花卉</h3>
                    <div class="item-list" id="flowersList"></div>
                </div>
            </div>

            <!-- ADMIN: PRODUCTS -->
            <div id="products" class="section">
                <div class="card">
                    <h2>📦 管理商品</h2>
                    
                    <h3>➕ 上架新商品</h3>
                    <div class="form-section">
                        <div class="form-grid">
                            <div class="form-group"><label>商品名稱</label><input type="text" id="product-name" placeholder="e.g. 黎明楓葉"></div>
                            <div class="form-group"><label>分類</label><select id="product-category"><option>背景</option><option>貼紙</option><option>音樂</option></select></div>
                            <div class="form-group"><label>定價（積分）</label><input type="number" id="product-cost" min="0" value="100"></div>
                            <div class="form-group"><label>Emoji</label><input type="text" id="product-emoji" placeholder="🍂" maxlength="2"></div>
                            <div class="form-group"><label>顏色代碼</label><input type="color" id="product-color" value="#FFA500"></div>
                            <div class="form-group"><label>商品描述</label><textarea id="product-description" placeholder="描述這個商品的特色..." style="height: 80px;"></textarea></div>
                        </div>
                        <button class="submit-btn" onclick="addProduct()">✅ 上架商品</button>
                    </div>

                    <h3>📋 已上架商品</h3>
                    <div class="item-list" id="productsList"></div>
                </div>
            </div>

            <!-- ADMIN: MODERATION -->
            <div id="moderation" class="section">
                <div class="card">
                    <h2>🔍 內容審查</h2>
                    <p style="color: var(--text-light); text-align: center; padding: 3rem;">
                        📝 內容審查功能開發中...<br>
                        待未來版本更新
                    </p>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn active" onclick="switchSection('dashboard', this)">📊</button>
            <button class="nav-btn user-only" onclick="switchSection('diary', this)">✍️</button>
            <button class="nav-btn user-only" onclick="switchSection('emotions', this)">💭</button>
            <button class="nav-btn" onclick="switchSection('shop', this)">🛍️</button>
            <button class="nav-btn admin-only" style="display:none;" onclick="switchSection('flowers', this)">🌸</button>
            <button class="nav-btn admin-only" style="display:none;" onclick="switchSection('products', this)">📦</button>
            <button class="nav-btn logout" onclick="logout()">🚪 登出</button>
        </div>
    </div>

    <script>
        // ===== 數據 =====
        const flowers = [
            { id: 1, cn: '向日葵', en: 'Sunflower', emoji: '🌻', language: '熱情、忠誠', valence: 0.95, arousal: 0.85 },
            { id: 2, cn: '薰衣草', en: 'Lavender', emoji: '💜', language: '寧靜、優雅', valence: 0.3, arousal: -0.7 },
        ];

        const shopItems = [
            { id: 'bg-maple', name: '楓糖燕麥', emoji: '🟤', type: 'background', color: '#F5EBE6', cost: 0, isOwned: true },
            { id: 'bg-dawn', name: '黎明楓葉', emoji: '🍂', type: 'background', color: '#FFA500', cost: 200, isOwned: false },
            { id: 'bg-sunset', name: '午後向日葵', emoji: '☀️', type: 'background', color: '#FFD700', cost: 350, isOwned: false },
            { id: 'sticker-flower', name: '療癒花卉', emoji: '✨', type: 'sticker', cost: 100, isOwned: false },
            { id: 'sticker-line', name: '溫暖線條', emoji: '📏', type: 'sticker', cost: 150, isOwned: false },
        ];

        const flowerAdjectives = ['暗戀的', '夢幻的', '溫暖的', '勇敢的', '寧靜的'];

        // ===== 狀態 =====
        let currentUser = null;
        let currentBackground = 'bg-maple';
        let currentStickers = [];
        let registeredUsers = { 'testuser': 'password123' };

        // ===== 登入 =====
        function switchLoginTab(tab, btn) {
            document.querySelectorAll('.form-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tabs .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            btn.classList.add('active');
        }

        function registerUser(e) {
            e.preventDefault();
            const u = document.getElementById('reg-username').value;
            const p = document.getElementById('reg-password').value;
            const c = document.getElementById('reg-confirm-password').value;
            if (p !== c) { alert('密碼不一致'); return; }
            if (registeredUsers[u]) { alert('帳號已存在'); return; }
            registeredUsers[u] = p;
            alert('✅ 帳號建立成功！');
            switchLoginTab('login', document.querySelectorAll('.tab-btn')[0]);
        }

        function loginUser(e) {
            e.preventDefault();
            const u = document.getElementById('user-username').value;
            const p = document.getElementById('user-password').value;
            if (!registeredUsers[u] || registeredUsers[u] !== p) {
                alert('❌ 帳號或密碼錯誤');
                return;
            }
            const adj = flowerAdjectives[Math.floor(Math.random() * flowerAdjectives.length)];
            const num = String(Math.floor(Math.random() * 1000)).padStart(3, '0');
            currentUser = { role: 'user', nickname: `${adj}向日葵 #${num}`, points: 500 };
            showApp();
        }

        function loginAdmin(e) {
            e.preventDefault();
            const u = document.getElementById('admin-username').value;
            const p = document.getElementById('admin-password').value;
            if (u !== 'admin001' || p !== 'adminPass123') {
                alert('❌ 帳號或密碼錯誤');
                return;
            }
            currentUser = { role: 'admin', username: u };
            showApp();
        }

        function showApp() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').classList.add('active');
            
            if (currentUser.role === 'admin') {
                document.getElementById('appHeader').innerHTML = '<h1>👑 管理員控制台</h1><p>系統管理 & 監控</p>';
                document.querySelectorAll('.user-only').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            } else {
                document.getElementById('appHeader').innerHTML = '<h1>💭 ' + currentUser.nickname + ' 的療癒手帳</h1>';
                document.querySelectorAll('.user-only').forEach(el => el.style.display = 'block');
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            }
            
            initializeApp();
        }

        // ===== 初始化 =====
        function initializeApp() {
            console.log(`🔧 初始化（${currentUser.role}模式）...`);
            renderShop();
            if (currentUser.role === 'user') {
                renderCustomizePanel();
                updateEmotion();
            } else {
                renderFlowersList();
                renderProductsList();
            }
            updateDashboard();
            console.log('✅ 初始化完成\n');
        }

        function updateDashboard() {
            if (currentUser.role === 'admin') {
                document.getElementById('stat1').textContent = shopItems.length;
                document.getElementById('stat1-label').textContent = '商品數';
                document.getElementById('stat2').textContent = flowers.length;
            } else {
                document.getElementById('stat1').textContent = currentUser.points;
                document.getElementById('stat1-label').textContent = '積分';
                document.getElementById('stat2').textContent = shopItems.filter(i => i.isOwned).length;
            }
        }

        // ===== 心情 =====
        function updateEmotion() {
            const v = parseFloat(document.getElementById('valenceSlider').value);
            const a = parseFloat(document.getElementById('arousalSlider').value);
            document.getElementById('valenceValue').textContent = v.toFixed(1);
            document.getElementById('arousalValue').textContent = a.toFixed(1);
            const closest = flowers.map(f => ({ ...f, d: Math.sqrt(Math.pow(v - f.valence, 2) + Math.pow(a - f.arousal, 2)) })).sort((a, b) => a.d - b.d)[0];
            document.getElementById('recommendedFlowers').innerHTML = `<div class="flower-card" style="background: linear-gradient(135deg, rgba(230, 161, 92, 0.1) 0%, rgba(107, 203, 119, 0.1) 100%); border: 3px solid var(--primary-warm);"><div class="flower-icon">${closest.emoji}</div><h3>${closest.cn}</h3><p>${closest.language}</p></div>`;
        }

        function recordEmotion() {
            currentUser.points += 50;
            updateDashboard();
            alert('✅ 心情已記錄！+50 點');
        }

        // ===== 商店 =====
        function renderShop() {
            const html = shopItems.map(item => {
                const btn = item.isOwned ? `<button class="buy-btn" disabled>✅ 已擁有</button>` : `<button class="buy-btn" onclick="purchaseItem('${item.id}')">🛒 購買</button>`;
                return `<div class="flower-card"><div class="flower-icon">${item.emoji}</div><h3>${item.name}</h3><p>💐 ${item.cost}</p>${btn}</div>`;
            }).join('');
            document.getElementById('shopItems').innerHTML = html;
        }

        function purchaseItem(id) {
            const item = shopItems.find(i => i.id === id);
            if (currentUser.points < item.cost) { alert('點數不夠'); return; }
            currentUser.points -= item.cost;
            item.isOwned = true;
            renderShop();
            renderCustomizePanel();
            updateDashboard();
            alert(`✅ 購買成功！剩餘 ${currentUser.points} 點`);
        }

        // ===== 客製化 =====
        function renderCustomizePanel() {
            const bgHtml = shopItems.filter(i => i.type === 'background').map(item => `
                <div class="item-slot ${!item.isOwned ? 'locked' : ''} ${item.id === currentBackground ? 'active' : ''}"
                     onclick="${!item.isOwned ? '' : `applyBackground('${item.id}')`}">
                    <span style="font-size: 1.2rem;">${!item.isOwned ? '🔒' : item.emoji}</span>
                    <span>${item.name}</span>
                </div>
            `).join('');
            document.getElementById('backgroundList').innerHTML = bgHtml;

            const stickerHtml = shopItems.filter(i => i.type === 'sticker').map(item => `
                <div class="item-slot ${!item.isOwned ? 'locked' : ''} ${currentStickers.includes(item.id) ? 'active' : ''}"
                     onclick="${!item.isOwned ? '' : `toggleSticker('${item.id}')`}">
                    <span style="font-size: 1.2rem;">${!item.isOwned ? '🔒' : item.emoji}</span>
                    <span>${item.name}</span>
                </div>
            `).join('');
            document.getElementById('stickerList').innerHTML = stickerHtml;
        }

        function applyBackground(id) {
            const bg = shopItems.find(i => i.id === id);
            if (!bg || !bg.isOwned) return;
            currentBackground = id;
            document.getElementById('diaryEditor').style.backgroundColor = bg.color;
            renderCustomizePanel();
        }

        function toggleSticker(id) {
            const s = shopItems.find(i => i.id === id);
            if (!s || !s.isOwned) return;
            currentStickers = currentStickers.includes(id) ? currentStickers.filter(x => x !== id) : [...currentStickers, id];
            renderCustomizePanel();
        }

        function switchPanelTab(tab, btn) {
            document.querySelectorAll('.panel-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.panel-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            btn.classList.add('active');
        }

        function saveDiary() {
            if (!document.getElementById('diaryText').value.trim()) { alert('請先寫日記'); return; }
            alert('💾 已保存！');
            document.getElementById('diaryText').value = '';
        }

        // ===== 管理員：花卉 =====
        function addFlower() {
            const cn = document.getElementById('flower-cn-name').value;
            const en = document.getElementById('flower-en-name').value;
            const emoji = document.getElementById('flower-emoji').value;
            const language = document.getElementById('flower-language').value;
            const valence = parseFloat(document.getElementById('flower-valence').value);
            const arousal = parseFloat(document.getElementById('flower-arousal').value);
            
            if (!cn || !en || !emoji || !language) { alert('請填寫所有必填欄位'); return; }
            
            flowers.push({ id: flowers.length + 1, cn, en, emoji, language, valence, arousal });
            alert('✅ 花卉已新增！');
            document.getElementById('flower-cn-name').value = '';
            document.getElementById('flower-en-name').value = '';
            document.getElementById('flower-emoji').value = '';
            document.getElementById('flower-language').value = '';
            document.getElementById('flower-valence').value = '0';
            document.getElementById('flower-arousal').value = '0';
            renderFlowersList();
            updateDashboard();
        }

        function deleteFlower(id) {
            flowers.splice(flowers.findIndex(f => f.id === id), 1);
            renderFlowersList();
            updateDashboard();
        }

        function renderFlowersList() {
            const html = flowers.map(f => `
                <div class="item-card">
                    <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                        <span style="font-size: 2rem;">${f.emoji}</span>
                        <div>
                            <h4>${f.cn} / ${f.en}</h4>
                            <p>${f.language}</p>
                        </div>
                    </div>
                    <p style="font-size: 0.85rem;">愉悅度: ${f.valence.toFixed(1)} | 能量: ${f.arousal.toFixed(1)}</p>
                    <div class="action-buttons">
                        <button class="btn-edit">✏️ 編輯</button>
                        <button class="btn-delete" onclick="deleteFlower(${f.id})">🗑️ 刪除</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('flowersList').innerHTML = html;
        }

        // ===== 管理員：商品 =====
        function addProduct() {
            const name = document.getElementById('product-name').value;
            const category = document.getElementById('product-category').value;
            const cost = parseInt(document.getElementById('product-cost').value);
            const emoji = document.getElementById('product-emoji').value;
            const color = document.getElementById('product-color').value;
            const desc = document.getElementById('product-description').value;
            
            if (!name || !emoji) { alert('請填寫必填欄位'); return; }
            
            const type = category === '背景' ? 'background' : category === '貼紙' ? 'sticker' : 'music';
            shopItems.push({ id: 'p-' + Date.now(), name, emoji, type, color, cost, isOwned: false, desc });
            alert('✅ 商品已上架！');
            document.getElementById('product-name').value = '';
            document.getElementById('product-cost').value = '100';
            document.getElementById('product-emoji').value = '';
            document.getElementById('product-color').value = '#FFA500';
            document.getElementById('product-description').value = '';
            renderProductsList();
            renderShop();
            updateDashboard();
        }

        function deleteProduct(id) {
            shopItems.splice(shopItems.findIndex(p => p.id === id), 1);
            renderProductsList();
            renderShop();
            updateDashboard();
        }

        function renderProductsList() {
            const html = shopItems.map(p => `
                <div class="item-card">
                    <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                        <span style="font-size: 2rem;">${p.emoji}</span>
                        <div>
                            <h4>${p.name}</h4>
                            <p>📂 ${p.type === 'background' ? '背景' : p.type === 'sticker' ? '貼紙' : '音樂'} | 💐 ${p.cost}</p>
                        </div>
                    </div>
                    ${p.desc ? `<p style="font-size: 0.85rem; margin-bottom: 0.5rem;">${p.desc}</p>` : ''}
                    <div class="action-buttons">
                        <button class="btn-edit">✏️ 編輯</button>
                        <button class="btn-delete" onclick="deleteProduct('${p.id}')">🗑️ 下架</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('productsList').innerHTML = html;
        }

        // ===== 導航 =====
        function switchSection(s, btn) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab, .nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(s).classList.add('active');
            if (btn) btn.classList.add('active');
        }

        function logout() {
            currentUser = null;
            document.getElementById('mainApp').classList.remove('active');
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('user-username').value = '';
            document.getElementById('user-password').value = '';
            document.getElementById('admin-username').value = '';
            document.getElementById('admin-password').value = '';
            document.getElementById('reg-username').value = '';
            document.getElementById('reg-password').value = '';
            document.getElementById('reg-confirm-password').value = '';
        }
    </script>
</body>
</html>
